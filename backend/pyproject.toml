[project]
name = "ducat-lens-backend"
version = "0.1.0"
description = "Warframe Ducat Kiosk analyzer backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.48.0",
    "python-multipart==0.0.29",
    "pillow==12.1.0",
    "rapidocr-onnxruntime==1.2.3",
    "numpy==2.4.0",
    "httpx==0.28.1",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    "ruff==0.15.14",
    "mypy==2.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["backend*"]
